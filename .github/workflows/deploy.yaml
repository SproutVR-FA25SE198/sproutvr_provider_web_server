name: CD - Main to DockerHub (Production)

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build and Push Docker Images to DockerHub
    runs-on: ubuntu-latest

    # Only execute if the merge commit includes "dev"
    if: contains(github.event.head_commit.message, 'Merge') || contains(github.event.head_commit.message, 'dev')

    # Define services
    strategy:
      fail-fast: false # Continue other jobs even if one fails
      matrix:
        service:
          - name: sproutvrprovider-service-gateway
            context: .
            dockerfile: src/Gateway/Gateway.API/Dockerfile
          - name: sproutvrprovider-service-account
            context: .
            dockerfile: src/Services/Accounts/Services.Accounts.Presentation/Dockerfile
          - name: sproutvrprovider-service-catalogs
            context: .
            dockerfile: src/Services/Catalogs/Services.Catalogs.Presentation/Dockerfile
          - name: sproutvrprovider-service-baskets
            context: .
            dockerfile: src/Services/Baskets/Services.Baskets.Presentation/Dockerfile
          - name: sproutvrprovider-service-orders
            context: .
            dockerfile: src/Services/Orders/Services.Orders.Presentation/Dockerfile
          - name: sproutvrprovider-service-notifications
            context: .
            dockerfile: src/Services/Notifications/Services.Notifications.Presentation/Dockerfile
          - name: sproutvrprovider-service-payments
            context: .
            dockerfile: src/Services/Payments/Services.Payments.Presentation/Dockerfile
          - name: sproutvrprovider-service-bundles
            context: .
            dockerfile: src/Services/Bundles/Services.Bundles.Presentation/Dockerfile

    steps:
      # Check out Code
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      # Step 1: Docker builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Step 2: Log in to DockerHub
      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 3: Docker metadata for image (Tags)
      - name: Define Image Tags and Labels (Dev)
        id: meta
        uses: docker/metadata-action@v5
        if: success()
        with:
          # This will result in: anonyfriday/sproutvrprovider-service-gateway
          images: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service.name }}
          tags: |
            type=raw,value=prod

      # Step 4: docker build and push
      - name: Build & Push ${{ matrix.service.name }}
        uses: docker/build-push-action@v6
        if: success()
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Step 5:
  apply-k8s:
    name: Apply K8S Deployments
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      # Check out Code
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Save DigitalOcean kubeconfig
        run: doctl kubernetes cluster kubeconfig save sproutvr

      - name: Apply the K8S deployments
        run: kubectl apply -f infra/K8S && kubectl apply -f infra/prod-k8s
