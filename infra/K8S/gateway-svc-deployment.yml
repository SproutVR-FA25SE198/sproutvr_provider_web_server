apiVersion: apps/v1
kind: Deployment
metadata:
  name: sproutvrprovider-service-gateway
  labels:
    app: sproutvrprovider-service-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sproutvrprovider-service-gateway
  template:
    metadata:
      labels:
        app: sproutvrprovider-service-gateway
    spec:
      containers:
        - name: gateway-service
          image: anonyfriday/sproutvrprovider-service-gateway:prod
          imagePullPolicy: Always
          ports:
            - name: web
              containerPort: 80
          envFrom:
            - configMapRef:
                name: sproutvrprovider-service-gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: sproutvrprovider-service-gateway-clusterip
spec:
  type: ClusterIP
  selector:
    app: sproutvrprovider-service-gateway
  ports:
    - name: web
      port: 80
      targetPort: 80
