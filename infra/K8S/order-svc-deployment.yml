apiVersion: apps/v1
kind: Deployment
metadata:
  name: sproutvrprovider-service-orders
  labels:
    app: sproutvrprovider-service-orders
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sproutvrprovider-service-orders
  template:
    metadata:
      labels:
        app: sproutvrprovider-service-orders
    spec:
      containers:
        - name: orders-service
          image: anonyfriday/sproutvrprovider-service-orders:prod
          imagePullPolicy: Always
          ports:
            - name: web
              containerPort: 80
            - name: grpc
              containerPort: 7707
          envFrom:
            - configMapRef:
                name: sproutvrprovider-service-orders-config
---
apiVersion: v1
kind: Service
metadata:
  name: sproutvrprovider-service-orders-clusterip
spec:
  type: ClusterIP
  selector:
    app: sproutvrprovider-service-orders
  ports:
    - name: web
      port: 80
      targetPort: 80
    - name: grpc
      port: 7707
      targetPort: 7707
