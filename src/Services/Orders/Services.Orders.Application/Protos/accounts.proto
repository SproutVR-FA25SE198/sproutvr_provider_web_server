syntax = "proto3";

option csharp_namespace = "AccountsService";

service GrpcAccount {
  rpc GetSystemAdminWithMinPendingOrders (GetSystemAdminWithMinPendingOrdersRequest) returns (GetSystemAdminWithMinPendingOrdersResponse);
}

message GetSystemAdminWithMinPendingOrdersRequest {
  // Empty request
}

message GetSystemAdminWithMinPendingOrdersResponse {
  string system_admin_id = 1;
  string full_name = 2;
  int32 number_of_pending_orders = 3;
}
