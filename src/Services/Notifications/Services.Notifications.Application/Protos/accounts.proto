syntax = "proto3";

option csharp_namespace = "AccountsService";

service GrpcAccount {
  rpc GetSystemAdminById (GetSystemAdminByIdRequest) returns (GetSystemAdminByIdResponse);
}

message GetSystemAdminByIdRequest {
  string system_admin_id = 1;
}

message GetSystemAdminByIdResponse {
  string system_admin_id = 1;
  string full_name = 2;
  int32 number_of_pending_orders = 3;
}
